[project]
name = "checkin"
description = "Daily checkin rewards system"
authors = []
telemetry = true
cache_dir = "./.clarinet/cache"
requirements = []


[contracts.checkin]
path = "contracts/checkin.clar"
clarity_version = 3
epoch = "3.0"

[repl.analysis]
passes = ["check_checker"]

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
